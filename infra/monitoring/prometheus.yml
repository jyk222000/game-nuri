global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - rules/*.yml   # infra/monitoring/rules/ (Kafka: kafka.rules.yml)
scrape_configs:
  - job_name: node
    static_configs:
      - targets: [proxy:9100, frontend1:9100, frontend2:9100, backend1:9100, backend2:9100,
                  kafka1:9100, kafka2:9100, kafka3:9100, backup:9100,
                  monitoring:9100, mariadb-pr:9100, mariadb-re:9100, elk:9100,
                  mongodb-pr:9100, mongo-se1:9100, mongo-se2:9100, valkey:9100]
  - job_name: kafka
    static_configs:
      - targets: [kafka1:9308]   # kafka_exporter
  - job_name: mariadb
    static_configs:
      - targets: [mariadb-pr:9104, mariadb-re:9104]
  - job_name: mongodb
    static_configs:
      - targets: [mongodb-pr:9216]
