global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend web
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/gamenuri.store.pem
    # 80으로 들어온 요청은 443으로 보낸다 (2026-11-29)
    http-request redirect scheme https code 301 unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    default_backend frontends

backend frontends
    balance roundrobin
    option httpchk GET /api/health
    server frontend1 frontend1:80 check
    server frontend2 frontend2:80 check

listen stats
    bind 10.0.1.1:8404
    stats enable
    stats uri /

# Kibana (elk:5601)를 강의실 LAN에 연다. 발표용 (2026-11-26, 남현식, 팀장 확인)
# 2026-11-29: 같은 인증서로 TLS를 종단한다 → https://gamenuri.store:5601 (도메인으로 접속해야 인증서 경고가 없다)
# proxy SELinux: semanage port -a -t http_port_t -p tcp 5601 (infra/elk/README.md 5장)
frontend kibana
    bind *:5601 ssl crt /etc/haproxy/certs/gamenuri.store.pem
    mode http
    default_backend kibana

backend kibana
    mode http
    server elk elk:5601 check
