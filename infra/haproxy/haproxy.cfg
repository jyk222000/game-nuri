global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend web
    bind *:80
    default_backend frontends

backend frontends
    balance roundrobin
    option httpchk GET /api/health
    server frontend1 frontend1:80 check
    server frontend2 frontend2:80 check

listen stats
    bind 10.0.1.1:8404
    stats enable
    stats uri /
